apiVersion: zabbix.venkain.io/v1alpha1
kind: Zabbix
metadata:
  name: zbx
  namespace: monitoring
spec:
  version: "8.0"
  database:
    cnpg:
      clusterName: zabbix-db
  # api is required when server.replicas > 1: the operator maintains
  # active-node routing from the HA node registry via the Zabbix API.
  # Create a token in the frontend (Users → API tokens) and store it in
  # a Secret with the key "token".
  api:
    tokenSecretRef:
      name: zbx-api-token
      key: token
  server:
    replicas: 1
    agent:
      enabled: true
  frontend:
    replicas: 1
  webService:
    replicas: 1
  # Optional: automate Kubernetes cluster monitoring through the
  # "Kubernetes Cluster by HTTP" template. Requires spec.api. The
  # operator deploys kube-state-metrics, a monitor service account +
  # token Secret, the cluster-scoped read RBAC, and registers the
  # Zabbix host (see README → Observability → Cluster metrics).
  # clusterMetrics:
  #   clusterName: kind-operator-lab
  #   tlsVerify: none
  #   namespace: observability   # default: the Zabbix resource's namespace
  #   namePrefix: my-cluster     # default: the Zabbix resource's name
  #   kubeStateMetrics:
  #     image:
  #       tag: v2.9.2
  #     resources: {}
