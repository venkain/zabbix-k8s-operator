apiVersion: zabbix.venkain.io/v1alpha1
kind: Zabbix
metadata:
  name: zbx
  namespace: monitoring
spec:
  version: "8.0"
  database:
    cnpg:
      clusterName: zabbix-db
  # api is required when server.replicas > 1: the operator maintains
  # active-node routing from the HA node registry via the Zabbix API.
  # Create a token in the frontend (Users → API tokens) and store it in
  # a Secret with the key "token".
  api:
    tokenSecretRef:
      name: zbx-api-token
      key: token
  server:
    replicas: 1
    agent:
      enabled: true
  frontend:
    replicas: 1
  webService:
    replicas: 1
  # Optional: automate Kubernetes cluster monitoring through the
  # "Kubernetes Cluster by HTTP" template. Requires spec.api. The
  # operator deploys kube-state-metrics, a monitor service account +
  # token Secret, the cluster-scoped read RBAC, and registers the
  # Zabbix host (see README → Observability → Cluster metrics).
  # clusterMetrics:
  #   clusterName: kind-operator-lab
  #   tlsVerify: none
  #   namespace: observability   # default: the Zabbix resource's namespace
  #   namePrefix: my-cluster     # default: the Zabbix resource's name
  #   kubeStateMetrics:
  #     image:
  #       tag: v2.9.2
  #     resources: {}
  # Optional (Zabbix 8.0+): store item history and APM telemetry in
  # ClickHouse instead of the SQL database. The operator wires the
  # official image entrypoints on the server and frontend; credentials
  # are delivered through Secret-backed files. See README → Telemetry
  # storage (ClickHouse).
  # telemetryStorage:
  #   clickhouse:
  #     # Managed mode: the operator deploys a single-node ClickHouse
  #     # (StatefulSet + PVC + Service) and generates its credentials.
  #     managed:
  #       storage: 50Gi             # default: 10Gi
  #       # storageClassName: fast-ssd
  #       # resources: {}
  #     # External mode instead: point at an existing ClickHouse.
  #     # endpoint: http://clickhouse.monitoring.svc:8123
  #     # database: zabbix          # default: zabbix
  #     # credentialsSecretRef:
  #     #   secretName: clickhouse-creds
  #     #   # usernameKey: username # default: username
  #     #   # passwordKey: password # default: password
  #     # valueTypes: [uint, dbl, str, log, text, json]   # default: all
  #     # createSchema: true       # default: entrypoint creates tables
  #     # tls:
  #     #   secretName: clickhouse-tls
  # Optional (Zabbix 8.0+): run the official Zabbix MCP server so AI
  # agents can read monitoring data and act on incidents through their
  # own API token (the server keeps no credentials). Set allowedIPs to
  # your MCP clients' addresses — the image default (localhost only) is
  # unusable in-cluster. See README → Agent integration (MCP server).
  # agentIntegration:
  #   mcp:
  #     allowedIPs: ["10.244.0.0/16"]
  #     # toolPrefix: zbx_          # avoid MCP tool-name conflicts
  #     # allowTools: []            # wildcard rules (REPLACE the image's
  #     # denyTools: []             # default policy entirely when set)
  #     # resources: {}
  #     # service:                  # default ClusterIP; NodePort/LB opt-in
  #     #   type: NodePort
  # Platform hardening: ON BY DEFAULT with safe settings — an absent
  # block means "enforce the hardened defaults". Opt out per knob.
  # The API-driven parts (password policy, MFA) require spec.api;
  # without it they are reported as pending on the HardeningReady
  # condition instead of being enforced. See README → Platform
  # hardening.
  # hardening:
  #   passwordPolicy:
  #     enabled: true             # default; false = stop enforcing
  #     # minLength: 12           # Zabbix passwd_min_length (1–70)
  #     # checkRules: [case, digits, special, commonPasswords]  # default: all
  #   networkPolicy: true         # default; false = no egress lockdown
  #   # mfa: {}                   # opt-in: presence enables TOTP MFA
  #     # hashFunction: sha512    # sha1 | sha256 | sha512
  #     # codeLength: 8           # 6 | 8

# Optional (Zabbix 8.0+): autoscaling for server, frontend, web
# service, and database read replicas. When enabled, the operator
# adjusts replicas between min/max based on observed load metrics.
# Requires spec.api for Zabbix API metrics (server, frontend, web
# service) or CNPG metrics endpoint (database).
# autoscaling:
#   server:
#     enabled: true
#     minReplicas: 2
#     maxReplicas: 6
#     metrics:
#       - type: QueueSize
#         target: 100
#       - type: PollerUtilization
#         target: 70
#     cooldownPeriod: 5m
#   frontend:
#     enabled: true
#     minReplicas: 1
#     maxReplicas: 10
#     metrics:
#       - type: RequestRate
#         target: 1000
#     cooldownPeriod: 3m
#   webService:
#     enabled: true
#     minReplicas: 1
#     maxReplicas: 4
#     metrics:
#       - type: RequestRate
#         target: 500
#     cooldownPeriod: 3m
#   database:
#     cnpg:
#       clusterName: zabbix-db
#       autoscaling:
#         enabled: true
#         minReadReplicas: 0
#         maxReadReplicas: 3
#         metrics:
#           - type: QueryLatencyP99
#             target: 500
#         cooldownPeriod: 10m
