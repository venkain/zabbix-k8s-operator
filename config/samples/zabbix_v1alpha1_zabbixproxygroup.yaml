apiVersion: zabbix.venkain.io/v1alpha1
kind: ZabbixProxyGroup
metadata:
  labels:
    app.kubernetes.io/name: zabbix-k8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: edge
  namespace: monitoring
spec:
  version: "8.0"
  groupName: edge-group
  # The Zabbix resource (same namespace) whose server these proxies
  # register with.
  serverRef: zbx
  replicas: 2
  # Optional group tuning; empty values use the server defaults.
  # failoverDelay: 1m
  # minOnline: 1
  # Optional (Zabbix 8.0+): run the OpenTelemetry (APM) collector on
  # every member; applications submit OTLP/gRPC to the group's
  # <name>-proxy-apm Service. Data lands in the telemetry provider
  # (ClickHouse) configured on the referenced Zabbix resource, and the
  # operator also enables the server-side APM configuration (global
  # data source + per-proxy data collection) through the Zabbix API.
  # apm:
  #   listenPort: 4317             # default: 4317 (OTLP/gRPC)
  #   maxMessagesPerSecond: 10000  # per-member OTLP message quota
  #   tlsSecretRef:
  #     secretName: apm-tls
