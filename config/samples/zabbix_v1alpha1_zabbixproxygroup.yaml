apiVersion: zabbix.venkain.io/v1alpha1
kind: ZabbixProxyGroup
metadata:
  labels:
    app.kubernetes.io/name: zabbix-k8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: edge
  namespace: monitoring
spec:
  version: "8.0"
  groupName: edge-group
  # The Zabbix resource (same namespace) whose server these proxies
  # register with.
  serverRef: zbx
  replicas: 2
  # Optional group tuning; empty values use the server defaults.
  # failoverDelay: 1m
  # minOnline: 1
