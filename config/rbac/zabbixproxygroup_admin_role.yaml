# This rule is not used by the project zabbix-k8s-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over zabbix.venkain.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: zabbix-k8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: zabbixproxygroup-admin-role
rules:
- apiGroups:
  - zabbix.venkain.io
  resources:
  - zabbixproxygroups
  verbs:
  - '*'
- apiGroups:
  - zabbix.venkain.io
  resources:
  - zabbixproxygroups/status
  verbs:
  - get
